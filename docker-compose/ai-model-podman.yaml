version: '3.8'

services:
    ollama:
        image: docker.io/ollama/ollama:latest
        restart: unless-stopped
        volumes:
          - ./ollama:/root/.ollama:z
          - ./ollama/models/:/root/.ollama/models/:z
        ports:
          - 11435:11434
          - 8080:80
        command: serve

networks:
  app:
    driver: bridge