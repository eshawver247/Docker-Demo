services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_compose
    ports:
      - 11434:11434
    volumes:
      - ollama_data:/root/.ollama
      - ./entrypoint.sh:/entrypoint.sh:ro,z
    restart: unless-stopped
    entrypoint: ["/bin/sh", "entrypoint.sh"]

  web:
    image: nginx:alpine
    container_name: html_server
    ports:
      - "8080:80"
    volumes:
      # Maps your custom file directly to Nginx's default index file
      - ./ui_example.html:/usr/share/nginx/html/index.html:ro,z

volumes:
  ollama_data:
  web_data:
